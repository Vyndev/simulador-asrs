<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Simulador ASRS</title>
<style>
  :root {
    --fondo: #f6f7f9; --tarjeta: #ffffff; --borde: #dde1e7; --texto: #1c2430; --suave: #5b6675;
    --vacio: #e6e9ee; --hueco: #cfd5de; --acento: #2563eb; --oro: #c9962b; --plata: #8791a0; --bronce: #a8683b;
    --clase1: #3b82f6; --clase2: #f59e0b; --clase3: #a855f7; --pendiente: #cfd5de;
    --almacenar: #0d9488; --recuperar: #db2777; --omitida: #dc2626; --error-fondo: #fde8e8; --exito: #15803d;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --fondo: #12161c; --tarjeta: #1a2029; --borde: #2c3542; --texto: #e6eaf0; --suave: #93a0b2;
      --vacio: #262e3a; --hueco: #171d26; --acento: #5b9bff; --oro: #e3b341; --plata: #a1abb9; --bronce: #cd8a57;
      --clase1: #5b9bff; --clase2: #fbbf24; --clase3: #c084fc; --pendiente: #323c4a;
      --almacenar: #2dd4bf; --recuperar: #f472b6; --omitida: #f87171; --error-fondo: #3a1d1f; --exito: #4ade80;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--fondo); color: var(--texto); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  .contenedor { max-width: 1600px; margin: 0 auto; padding: 20px 16px 48px; }
  .encabezado { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
  h1 { font-size: 22px; margin: 0 0 2px; }
  .sub { color: var(--suave); margin: 0; }
  .app { display: grid; grid-template-columns: 350px minmax(0, 1fr); gap: 16px; align-items: start; }
  .app.sin-parametros { grid-template-columns: minmax(0, 1fr); }
  .app.sin-parametros .parametros { display: none; }
  .app.cerrado { grid-template-columns: minmax(0, 1fr); }
  .app.cerrado .parametros { display: none; }
  button, select, input { font: inherit; color: var(--texto); }
  button, select { background: var(--fondo); border: 1px solid var(--borde); border-radius: 8px; padding: 6px 12px; cursor: pointer; }
  button:hover, select:hover { border-color: var(--acento); }
  button.primario { background: var(--acento); border-color: var(--acento); color: #fff; font-weight: 600; min-width: 96px; }
  button:disabled { opacity: .55; cursor: not-allowed; }
  input[type=number], input[type=text] { background: var(--fondo); border: 1px solid var(--borde); border-radius: 6px; padding: 4px 8px; width: 100%; min-width: 0; }
  input:focus-visible, button:focus-visible, select:focus-visible { outline: 2px solid var(--acento); outline-offset: 1px; }
  input.invalido { border-color: var(--omitida); }
  label { color: var(--suave); display: flex; align-items: center; gap: 8px; }
  input[type=range] { width: 150px; accent-color: var(--acento); }

  /* parámetros */
  .parametros { position: sticky; top: 12px; max-height: calc(100vh - 24px); overflow: auto; display: flex; flex-direction: column; gap: 10px; padding-right: 2px; }
  .acciones { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; background: var(--tarjeta); border: 1px solid var(--borde); border-radius: 10px; padding: 10px; position: sticky; top: 0; z-index: 2; }
  .acciones .primario { grid-column: 1 / -1; padding: 8px 12px; }
  .acciones button:not(.primario) { padding: 5px 6px; font-size: 13px; }
  #formulario { display: flex; flex-direction: column; gap: 10px; }
  .resumen-param { display: grid; grid-template-columns: 1.6fr 1fr 1fr 1fr; gap: 6px; }
  .ficha-res { background: var(--tarjeta); border: 1px solid var(--borde); border-radius: 8px; padding: 4px 8px; font-weight: 600; font-size: 13px; font-variant-numeric: tabular-nums; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ficha-res small { display: block; color: var(--suave); font-weight: 400; font-size: 10px; text-transform: uppercase; letter-spacing: .03em; }
  .ficha-res.mal { border-color: var(--omitida); color: var(--omitida); }
  .pestanas { display: grid; grid-template-columns: repeat(4, 1fr); gap: 3px; background: var(--vacio); border-radius: 10px; padding: 3px; }
  .pestanas button { border: 0; background: transparent; border-radius: 8px; padding: 7px 4px; color: var(--suave); font-size: 13.5px; }
  .pestanas button:hover { color: var(--texto); }
  .pestanas button.activa { background: var(--tarjeta); color: var(--texto); font-weight: 700; box-shadow: 0 1px 2px rgba(0,0,0,.18); }
  .panel-pestana { display: flex; flex-direction: column; gap: 10px; }
  .panel-pestana[hidden] { display: none; }
  .seccion { background: var(--tarjeta); border: 1px solid var(--borde); border-radius: 10px; padding: 10px 12px 12px; }
  .seccion > h3, .seccion > summary { margin: 0 0 8px; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--suave); }
  .seccion > summary { cursor: pointer; margin: 0; list-style: none; display: flex; justify-content: space-between; }
  .seccion > summary::-webkit-details-marker { display: none; }
  .seccion > summary::after { content: '+'; font-weight: 400; }
  details.seccion[open] > summary { margin-bottom: 8px; } details.seccion[open] > summary::after { content: '–'; }
  .seccion.inactivo > .cuerpo-seccion { opacity: .5; }
  .cuerpo-seccion { display: grid; gap: 10px; }
  .campo { display: grid; grid-template-columns: minmax(0, 1fr) 92px; align-items: center; gap: 10px; font-size: 14px; }
  .campo .etq { color: var(--texto); }
  .campo .etq small, .trio-tit small { color: var(--suave); margin-left: 5px; font-size: 12px; font-weight: 400; }
  .trio { display: grid; gap: 4px; }
  .trio-tit { font-size: 13.5px; font-weight: 600; }
  .trio-campos { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
  .trio-campos.dos { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .trio-campos label, .bloque { display: grid; gap: 2px; color: var(--texto); }
  .trio-campos small, .bloque small { color: var(--suave); font-size: 12px; }
  .bloque small em { font-style: normal; opacity: .85; }
  .nota { color: var(--suave); font-size: 12.5px; margin: 0; }
  .aviso-clases:empty { display: none; } .aviso-clases { color: var(--omitida); }
  .tabla-clases { display: grid; grid-template-columns: 26px 78px minmax(0, 1fr); gap: 6px 8px; align-items: center; font-size: 13.5px; }
  .tabla-clases .enc { color: var(--suave); font-size: 12px; }
  .tabla-clases .pct { color: var(--suave); font-variant-numeric: tabular-nums; font-size: 12.5px; }
  .grafico-demanda { display: flex; align-items: flex-end; gap: 1px; height: 64px; padding: 4px; background: var(--fondo); border: 1px solid var(--borde); border-radius: 8px; }
  .grafico-demanda i { flex: 1; min-width: 1px; border-radius: 2px 2px 0 0; }
  .ficha { display: inline-flex; width: 22px; height: 22px; border-radius: 6px; align-items: center; justify-content: center; font-weight: 800; font-size: 13px; color: #10151c; }
  .botones-fila { display: flex; gap: 8px; }
  .politica { display: flex; gap: 8px; align-items: flex-start; color: var(--texto); font-size: 14px; }
  .politica input { margin-top: 3px; accent-color: var(--acento); }
  .politica small { display: block; color: var(--suave); font-size: 12.5px; }

  /* avisos y progreso */
  .aviso { display: none; border-radius: 10px; padding: 10px 14px; margin-bottom: 14px; border: 1px solid var(--borde); background: var(--tarjeta); }
  .aviso.visible { display: block; }
  .aviso.error { background: var(--error-fondo); border-color: var(--omitida); color: var(--omitida); }
  .aviso.exito { border-color: var(--exito); }
  .progreso { display: flex; align-items: center; gap: 12px; }
  .progreso .barra { flex: 1; height: 10px; background: var(--vacio); border-radius: 5px; overflow: hidden; }
  .progreso .barra i { display: block; height: 100%; width: 0; background: var(--acento); transition: width .25s; }

  /* carrera */
  .controles { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; background: var(--tarjeta); border: 1px solid var(--borde); border-radius: 10px; padding: 10px 14px; margin-bottom: 14px; }
  .reloj { margin-left: auto; font-variant-numeric: tabular-nums; font-weight: 600; font-size: 18px; }
  .reloj small { color: var(--suave); font-weight: 400; font-size: 13px; }
  .leyenda { display: flex; flex-wrap: wrap; gap: 6px 16px; color: var(--suave); font-size: 13px; margin: 0 0 14px; }
  .leyenda span { display: inline-flex; align-items: center; gap: 6px; }
  .punto { width: 11px; height: 11px; border-radius: 3px; display: inline-block; }
  .marcador { background: var(--tarjeta); border: 1px solid var(--borde); border-radius: 10px; padding: 12px 14px; margin-bottom: 14px; }
  .marcador h2, .resultados h2, .estadistica h2 { font-size: 14px; margin: 0 0 8px; color: var(--suave); font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
  .fila { display: grid; grid-template-columns: 34px 170px 1fr 120px; align-items: center; gap: 10px; padding: 3px 0; }
  .fila .lugar { font-weight: 700; color: var(--suave); text-align: center; }
  .fila .barra { height: 12px; background: var(--vacio); border-radius: 6px; overflow: hidden; }
  .fila .barra i { display: block; height: 100%; width: 0; background: var(--acento); border-radius: 6px; }
  .fila .valor { text-align: right; font-variant-numeric: tabular-nums; color: var(--suave); }
  .fila.termino .barra i { background: var(--almacenar); }
  .paneles { display: grid; grid-template-columns: repeat(auto-fit, minmax(330px, 1fr)); gap: 14px; }
  .vacio-escena { background: var(--tarjeta); border: 1px dashed var(--borde); border-radius: 12px; padding: 40px 16px; text-align: center; color: var(--suave); }
  .panel { background: var(--tarjeta); border: 1px solid var(--borde); border-radius: 12px; padding: 12px; }
  .panel.termino { border-color: var(--almacenar); }
  .panel .cabecera { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .panel h3 { margin: 0; font-size: 16px; }
  .leyenda-panel { display: flex; flex-wrap: wrap; align-items: center; gap: 3px 10px; font-size: 12px; color: var(--suave); margin: -2px 0 8px; }
  .leyenda-panel span { display: inline-flex; align-items: center; gap: 5px; }
  .degradado { width: 90px; height: 10px; border-radius: 5px; border: 1px solid var(--borde); }
  .insignia { font-weight: 700; font-size: 13px; padding: 2px 10px; border-radius: 999px; background: var(--vacio); color: var(--suave); }
  .insignia.l1 { background: var(--oro); color: #fff; } .insignia.l2 { background: var(--plata); color: #fff; } .insignia.l3 { background: var(--bronce); color: #fff; }
  canvas { width: 100%; height: auto; display: block; }
  .estado { min-height: 62px; margin-bottom: 6px; }
  .estado .linea { display: flex; align-items: center; gap: 10px; }
  .estado .tipo { font-weight: 800; font-size: 20px; letter-spacing: .05em; color: var(--suave); }
  .estado .tipo.almacenar { color: var(--almacenar); } .estado .tipo.recuperar { color: var(--recuperar); }
  .estado .tipo.omitida { color: var(--omitida); }
  .estado .chip { display: none; min-width: 30px; height: 30px; padding: 0 9px; border-radius: 7px; align-items: center; justify-content: center; font-weight: 800; font-size: 15px; color: #10151c; white-space: nowrap; }
  .estado .accion { display: block; color: var(--suave); font-size: 13px; min-height: 18px; margin-top: 2px; }
  .tareas { display: grid; gap: 2px; margin: 10px 0 8px; }
  .tareas i { height: 9px; border-radius: 2px; background: var(--pendiente); }
  .tareas i.a { background: var(--almacenar); opacity: .35; } .tareas i.r { background: var(--recuperar); opacity: .35; }
  .tareas i.hecha { opacity: 1; } .tareas i.actual { opacity: 1; outline: 2px solid var(--texto); outline-offset: 1px; }
  .tareas i.omitida { background: transparent; outline: 1px solid var(--omitida); outline-offset: -1px; opacity: 1; }
  .pie { display: flex; justify-content: space-between; color: var(--suave); font-size: 13px; font-variant-numeric: tabular-nums; }
  .resultados, .estadistica { display: none; background: var(--tarjeta); border: 1px solid var(--borde); border-radius: 10px; padding: 12px 14px; margin-top: 14px; }
  .resultados.visible, .estadistica.visible { display: block; }
  .estadistica .cabecera-est { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .estadistica .cabecera-est h2 { margin: 0; }
  .estadistica .nota { margin: 8px 0 0; }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  th, td { text-align: left; padding: 6px 10px; border-bottom: 1px solid var(--borde); }
  th { color: var(--suave); font-weight: 600; font-size: 13px; }
  td.num, th.num { text-align: right; }
  tr.mejor td { font-weight: 700; }
  .celda-barra { position: relative; min-width: 110px; }
  .celda-barra .b { position: absolute; left: 0; top: 50%; height: 14px; transform: translateY(-50%); background: var(--acento); opacity: .22; border-radius: 3px; }
  .celda-barra .e { position: absolute; top: 50%; height: 2px; transform: translateY(-50%); background: var(--texto); opacity: .7; }
  .celda-barra span { position: relative; }
  .tabla-ancha { overflow-x: auto; }
  @media (max-width: 980px) { .app { grid-template-columns: minmax(0, 1fr); } .parametros { position: static; max-height: none; } }
  @media (max-width: 640px) { .fila { grid-template-columns: 26px 110px 1fr 76px; gap: 6px; } .reloj { margin-left: 0; } }
</style>
</head>
<body>
<div class="contenedor">
  <header class="encabezado">
    <div>
      <h1>Simulador ASRS</h1>
      <p class="sub">Todas las políticas de asignación ejecutan la misma lista de tareas sobre un mismo reloj. Gana la que termina primero.</p>
    </div>
    <button id="btnParametros" style="display:none">Ocultar parámetros</button>
  </header>

  <div class="app sin-parametros" id="app">
    <aside class="parametros" id="parametros">
      <div class="acciones">
        <button id="btnSimular" class="primario">Simular</button>
        <button id="btnRestablecer" title="Vuelve a los valores iniciales">Restablecer</button>
        <button id="btnGuardar" title="Descarga los parámetros en un archivo JSON">Guardar</button>
        <button id="btnCargar" title="Carga parámetros desde un archivo JSON">Cargar</button>
        <input type="file" id="archivoConfig" accept="application/json,.json" hidden>
      </div>
      <div id="formulario"></div>
    </aside>

    <main>
      <div class="aviso" id="aviso"></div>

      <div class="controles" id="controles">
        <button id="jugar" class="primario">Iniciar</button>
        <button id="reiniciar">Reiniciar</button>
        <button id="final">Ir al final</button>
        <label>Réplica <select id="replica"></select></label>
        <label>Velocidad <input id="velocidad" type="range" min="0" max="100" value="55"><span id="velocidadTexto"></span></label>
        <div class="reloj"><small>Tiempo simulado</small> <span id="reloj">0</span> s</div>
      </div>

      <div class="leyenda" id="leyenda"></div>

      <section class="marcador"><h2>Marcador</h2><div id="marcador"></div></section>
      <section class="paneles" id="paneles"></section>

      <section class="resultados" id="resultados">
        <h2>Resultado de esta réplica</h2>
        <table><thead><tr><th>Lugar</th><th>Política</th><th class="num">Tiempo total (s)</th><th class="num">Diferencia con la mejor</th><th class="num">Reubicaciones</th></tr></thead><tbody id="tabla"></tbody></table>
      </section>

      <section class="estadistica" id="estadistica">
        <div class="cabecera-est">
          <h2 id="tituloEstadistica">Estadística</h2>
          <div class="botones-fila">
            <label>Métrica <select id="metrica"></select></label>
            <button id="btnCsv">Descargar CSV</button>
          </div>
        </div>
        <div class="tabla-ancha"><table><thead id="encEstadistica"></thead><tbody id="cuerpoEstadistica"></tbody></table></div>
        <p class="nota" id="notaEstadistica"></p>
      </section>
    </main>
  </div>
</div>

<script>
const DATOS_INICIALES = /*DATOS*/null;

const POLITICAS = [
  { clave: 'aleatoria', nombre: 'Aleatoria', ayuda: 'Canal al azar; dentro del canal, la celda libre más profunda.' },
  { clave: 'basada_en_clases', nombre: 'Basada en clases', ayuda: 'Agrupa los SKUs en clases por demanda; cada clase tiene una zona fija y la clase A queda más cerca del E/S.' },
  { clave: 'full_turnover', nombre: 'Full-turnover', ayuda: 'Cada SKU tiene su propia zona fija, ordenadas por demanda: el SKU más demandado va más cerca.' },
  { clave: 'mas_cercana_es', nombre: 'Más cercana al E/S', ayuda: 'La celda libre más cercana al punto de entrada y salida.' },
  { clave: 'mas_cercana_grua', nombre: 'Más cercana a la grúa', ayuda: 'La celda libre más cercana a la grúa (al reubicar, a la celda del ítem que se retira).' }
];
const NOMBRES = { Aleatoria: 'Aleatoria', BasadaEnClases: 'Basada en clases', FullTurnover: 'Full-turnover', MasCercanaAlES: 'Más cercana al E/S', MasCercanaALaGrua: 'Más cercana a la grúa' };

const letra = c => c ? String.fromCharCode(64 + c) : '';
const DPR = Math.min(window.devicePixelRatio || 1, 2);
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const PALETA_EXTRA = ['', '', '', '#34d399', '#f87171', '#22d3ee', '#fb923c', '#a3e635'];
const colorGrupo = g => g <= 3 ? (css('--clase' + g) || '#888') : (PALETA_EXTRA[g - 1] || '#999');
let CLASE_SKU = [];                                   // clase de cada SKU (solo para colorear), indexada por SKU - 1
let RANGO_SKU = [];                                   // posición de cada SKU en el ranking de rotación (0 = el más demandado), indexada por SKU - 1
// Rotación del SKU: degradado continuo de amarillo (más rotación) a violeta (menos rotación)
const PALETA_ROTACION = ['#fde725', '#7ad151', '#22a884', '#2a788e', '#414487', '#440154'];
function colorRotacion(t) {
  const n = PALETA_ROTACION.length - 1, x = Math.min(1, Math.max(0, t)) * n, i = Math.min(n - 1, Math.floor(x)), f = x - i;
  const a = PALETA_ROTACION[i], b = PALETA_ROTACION[i + 1], c = k => Math.round(parseInt(a.slice(k, k + 2), 16) * (1 - f) + parseInt(b.slice(k, k + 2), 16) * f);
  return 'rgb(' + c(1) + ',' + c(3) + ',' + c(5) + ')';
}
const fmt = n => Math.round(n).toLocaleString('es');
const fmt1 = n => (Math.round(n * 10) / 10).toLocaleString('es');
const el = id => document.getElementById(id);

// ================= escena isométrica (se recalcula con cada simulación) =================
let DATOS = null, SECUENCIA = [], totalTareas = 0;
let FILAS, COLUMNAS, CAPAS, VEL_FILA, VEL_COLUMNA, VEL_PROF, ACEL, DECEL, COTA_FILA, COTA_COLUMNA, COTA_PROF, Z_RIEL, POS, CEN, RIEL;
let COL_M, FIL_M, PRO_M, LARGO, ALTURA, FONDO, PLATAFORMA, ES_X, ESC, ESC_V, LIM, OX, OY, ANCHO, ALTO, DIR_VISTA, ORDEN_HUECOS, RANGO, DEN_Z;
const DY = 0.55, C30 = Math.cos(Math.PI / 6);
const proy0 = (X, Y, H) => [(X - Y * DY) * C30 * ESC, (X + Y * DY) * 0.5 * ESC - H * ESC_V];
const proy = (X, Y, H) => { const [a, b] = proy0(X, Y, H); return [a + OX, b + OY]; };

function limitesProyeccion() {
  let minX = 1e9, minY = 1e9, maxX = -1e9, maxY = -1e9;
  [LIM.x0, LIM.x1].forEach(X => [LIM.y0, LIM.y1].forEach(Y => [LIM.h0, LIM.h1].forEach(H => {
    const [a, b] = proy0(X, Y, H); minX = Math.min(minX, a); maxX = Math.max(maxX, a); minY = Math.min(minY, b); maxY = Math.max(maxY, b);
  })));
  return { minX, minY, maxX, maxY };
}

function prepararEscena() {
  [FILAS, COLUMNAS, CAPAS] = DATOS.configuracion;
  CLASE_SKU = DATOS.clase_sku || []; RANGO_SKU = DATOS.rango_sku || [];
  [VEL_FILA, VEL_COLUMNA, VEL_PROF] = DATOS.velocidad;
  ACEL = DATOS.aceleracion || [0, 0, 0]; DECEL = DATOS.deceleracion || [0, 0, 0];
  [COTA_FILA, COTA_COLUMNA, COTA_PROF] = DATOS.cotas;
  Z_RIEL = DATOS.z_riel; POS = DATOS.posicion || [0, 0, 0]; CEN = DATOS.centro || [0, 0, 0];
  RIEL = Z_RIEL - POS[2];                                               // posición del pasillo medida desde el fondo de la estantería
  COL_M = COTA_COLUMNA; FIL_M = COTA_FILA; PRO_M = COTA_PROF;
  LARGO = COLUMNAS * COL_M; ALTURA = FILAS * FIL_M; FONDO = CAPAS * PRO_M;
  // E/S: plataforma a nivel del suelo, en el pasillo, pasado el extremo izquierdo de la estantería (abajo a la izquierda)
  PLATAFORMA = { x0: -3.2, x1: -1.1, y0: RIEL - 0.8, y1: RIEL + 0.8, h: 0.5 };
  ES_X = (PLATAFORMA.x0 + PLATAFORMA.x1) / 2;

// Perfil de velocidad de un eje: acelera hasta la velocidad máxima, avanza a velocidad constante y frena
// Si la distancia es corta no llega a la velocidad máxima (perfil triangular). Una aceleración de 0 significa sin límite
// Es la misma fórmula que usa Python para calcular el tiempo, así la animación y los tiempos coinciden
// Devuelve la duración T y la fracción recorrida (de 0 a 1) en el instante tau
function perfilEje(D, v, a, d) {
  if (!(D > 0)) return { T: 0, fraccion: () => 1 };
  const ia = a > 0 ? 1 / a : 0, id = d > 0 ? 1 / d : 0, da = v * v * ia / 2, dd = v * v * id / 2;

    if (tau >= T) return 1; if (tau <= 0) return 0;
    if (tau < t1) return 0.5 * a * tau * tau / D;
    if (tau < t2) return (0.5 * vp * t1 + vp * (tau - t1)) / D;
    return (D - 0.5 * d * (T - tau) * (T - tau)) / D;
  };
  return { T, fraccion };
}

const tonos = new Map();

function tono(color, factor) {

}

  dibujar(tiempo) {

    g.drawImage(this.capaItems, 0, 0, ANCHO, ALTO);

    g.strokeStyle = 'rgba(0,0,0,0.35)'; g.lineWidth = 1;   // rodillos
    for (let i = 1; i < 6; i++) { const X = PLATAFORMA.x0 + (PLATAFORMA.x1 - PLATAFORMA.x0) * i / 6, a = proy(X, PLATAFORMA.y0, PLATAFORMA.h), b = proy(X, PLATAFORMA.y1, PLATAFORMA.h); g.beginPath(); g.moveTo(a[0], a[1]); g.lineTo(b[0], b[1]); g.stroke(); }

    const et = proy(ES_X, RIEL, 1.6);

    const texto = entra ? 'ENTRA' : (sale || this.destinoES) ? 'SALE' : 'E/S';
    g.lineWidth = 3.5; g.strokeStyle = 'rgba(0,0,0,0.7)'; g.strokeText(texto, et[0], et[1]);
    g.fillStyle = activo || '#ffffff'; g.fillText(texto, et[0], et[1]); g.textAlign = 'left'; g.textBaseline = 'alphabetic';

    });

    g.strokeStyle = css('--suave'); g.lineWidth = 1.5;
    [0, ALTURA + 0.7].forEach(H => { const a = proy(LIM.x0 + 1.6, RIEL, H), b = proy(LARGO + 0.2, RIEL, H); g.beginPath(); g.moveTo(a[0], a[1]); g.lineTo(b[0], b[1]); g.stroke(); });

    // celda destino: el hueco se enmarca con un armazón pulsante, turquesa si se deja un ítem y rosa si se retira
    const d = this.destino;
    if (d) {
      const col = d.tipo === 'D' ? colorAlm : colorRec;
      const x0 = d.c * COL_M, y0 = d.k * PRO_M, h0 = d.f * FIL_M;
      if (d.fin) {
        const s = (ahora - d.fin) / 500;
        if (s >= 1) this.destino = null;
        else { g.globalAlpha = 1 - s; this.armazon(g, x0 - s * 0.6, x0 + COL_M + s * 0.6, y0 - s * 0.3, y0 + PRO_M + s * 0.3, h0 - s * 0.5, h0 + FIL_M + s * 0.5, col, 2.5); g.globalAlpha = 1; }
      } else {
        this.armazon(g, x0, x0 + COL_M, y0, y0 + PRO_M, h0, h0 + FIL_M, 'rgba(0,0,0,0.7)', 5);
        g.globalAlpha = 0.75 + 0.25 * Math.sin(ahora / 170); this.armazon(g, x0, x0 + COL_M, y0, y0 + PRO_M, h0, h0 + FIL_M, col, 2.6); g.globalAlpha = 1;
      }
    }

    // trayectoria Chebyshev en el plano del pasillo: los dos ejes salen a la vez, cada uno a su velocidad
    // el camino es una diagonal hasta que llega el eje más rápido (codo) y luego sigue recto por el otro eje

      g.fillStyle = '#ffffff'; g.strokeStyle = 'rgba(0,0,0,0.65)'; g.lineWidth = 1.5; g.stroke(); g.fill();

    }

    // grúa: mástil sobre el riel, carro a la altura de la fila y horquilla que entra al canal
    const mastil = [proy(e.X, RIEL, 0), proy(e.X, RIEL, ALTURA + 0.7)];
    g.strokeStyle = 'rgba(0,0,0,0.55)'; g.lineWidth = 5; g.beginPath(); g.moveTo(mastil[0][0], mastil[0][1]); g.lineTo(mastil[1][0], mastil[1][1]); g.stroke();
    g.strokeStyle = css('--texto'); g.lineWidth = 2.5; g.beginPath(); g.moveTo(mastil[0][0], mastil[0][1]); g.lineTo(mastil[1][0], mastil[1][1]); g.stroke();
    if (e.Y < RIEL - 0.02) this.caja(g, e.X - 0.13, e.X + 0.13, e.Y, RIEL, e.H - 0.15, e.H + 0.05, e.fase === 1 ? css('--acento') : '#cbd5e1', 'rgba(0,0,0,0.5)');   // horquilla
    if (this.mano) this.caja(g, e.X - 0.34, e.X + 0.34, e.Y - 0.3, e.Y + 0.3, e.H + 0.05, e.H + 0.75, this.colorSku(this.mano), 'rgba(0,0,0,0.6)');
    this.caja(g, e.X - 0.55, e.X + 0.55, RIEL - 0.35, RIEL + 0.35, e.H - 0.5, e.H - 0.1, e.fase === 1 ? css('--acento') : '#f8fafc', 'rgba(0,0,0,0.6)');   // carro

  actualizarPie(tiempo) {

}

// ================= carrera =================
// Leyenda propia de cada panel: qué significa el color de los ítems en esa política
function leyendaPanel(modo) {
  if (modo === 'clase') {
    let h = '<span>Color = clase del SKU</span>';
    for (let c = 1; c <= Math.max(1, ...CLASE_SKU); c++) {
      const skus = CLASE_SKU.reduce((a, g) => a + (g === c ? 1 : 0), 0), dem = (DATOS.demanda_sku || []).reduce((a, d, i) => a + (CLASE_SKU[i] === c ? d : 0), 0);
      h += '<span><i class="punto" style="background:' + colorGrupo(c) + '"></i>' + letra(c) + ' · ' + skus + (skus === 1 ? ' SKU' : ' SKUs') + ' · ' + Math.round(100 * dem) + ' %</span>';
    }
    return h;
  }
  return '<span>Color = rotación del SKU</span><span class="degradado" style="background:linear-gradient(90deg,' + PALETA_ROTACION.join(',') + ')"></span><span>más → menos</span>';
}

function construir() {
  const r = DATOS.replicas[replicaActual];
  SECUENCIA = r.secuencia; totalTareas = SECUENCIA.length;
  const columnasTareas = totalTareas <= 72 ? 36 : (totalTareas <= 300 ? 60 : 100);
  const cont = el('paneles'); cont.innerHTML = '';
  paneles = r.politicas.map(p => {
    const tarjeta = document.createElement('article'); tarjeta.className = 'panel';
    tarjeta.innerHTML = '<div class="cabecera"><h3>' + (NOMBRES[p.nombre] || p.nombre) + '</h3><span class="insignia"></span></div>' +
      '<div class="leyenda-panel">' + leyendaPanel(p.color_por || 'clase') + '</div>' +
      '<div class="estado"><div class="linea"><span class="tipo"></span><span class="chip"></span></div><span class="accion"></span></div><canvas></canvas>' +
      '<div class="tareas" style="grid-template-columns:repeat(' + columnasTareas + ',1fr)">' + SECUENCIA.map(() => '<i></i>').join('') + '</div><div class="pie"></div>';
    cont.appendChild(tarjeta);
    return new Panel(p, tarjeta);
  });
  const marc = el('marcador'); marc.innerHTML = '';
  paneles.forEach((p, i) => {
    const f = document.createElement('div'); f.className = 'fila'; f.dataset.i = i;
    f.innerHTML = '<span class="lugar">–</span><span>' + (NOMBRES[p.d.nombre] || p.d.nombre) + '</span><span class="barra"><i></i></span><span class="valor"></span>';
    marc.appendChild(f);
  });
  el('resultados').classList.remove('visible');
  reiniciar();
}

function reiniciar() {
  t = 0; lugarSiguiente = 1; jugando = false;
  el('jugar').textContent = 'Iniciar';
  paneles.forEach(p => p.reiniciar());
  paso(0);
}

function marcador() {
  const filas = Array.from(document.querySelectorAll('.fila'));
  const orden = paneles.map((p, i) => i).sort((a, b) => {
    const A = paneles[a], B = paneles[b];
    if (A.fin !== null && B.fin !== null) return A.fin - B.fin;
    if (A.fin !== null) return -1; if (B.fin !== null) return 1;
    return B.progreso() - A.progreso();
  });
  const cont = el('marcador');
  orden.forEach((i, pos) => {
    const f = filas.find(x => +x.dataset.i === i), p = paneles[i];
    f.querySelector('.lugar').textContent = p.fin !== null ? p.lugar + '.º' : (pos + 1);
    f.querySelector('.barra i').style.width = (100 * p.progreso() / totalTareas) + '%';
    f.querySelector('.valor').textContent = p.fin !== null ? fmt(p.fin) + ' s' : p.progreso() + '/' + totalTareas;
    f.classList.toggle('termino', p.fin !== null);
    cont.appendChild(f);
  });
}

function resultados() {
  const orden = paneles.slice().sort((a, b) => a.fin - b.fin), mejor = orden[0].fin;
  el('tabla').innerHTML = orden.map((p, i) =>
    '<tr><td>' + (i + 1) + '.º</td><td>' + (NOMBRES[p.d.nombre] || p.d.nombre) + '</td><td class="num">' + fmt(p.fin) +
    '</td><td class="num">' + (i === 0 || mejor === 0 ? '–' : '+' + fmt(p.fin - mejor) + ' s (+' + (100 * (p.fin - mejor) / mejor).toFixed(0) + ' %)') +
    '</td><td class="num">' + p.d.reubicaciones + '</td></tr>').join('');
  el('resultados').classList.add('visible');
}

let ultimoMarcador = 0;
function paso(dt) {
  if (!paneles.length) return;
  t += dt;
  paneles.forEach(p => { p.avanzar(t); p.dibujar(t); p.actualizarPie(t); });
  el('reloj').textContent = fmt(t);
  const ahora = performance.now();
  if (ahora - ultimoMarcador > 150 || dt === 0) { marcador(); ultimoMarcador = ahora; }
  if (paneles.every(p => p.fin !== null)) {
    marcador(); resultados();
    jugando = false; el('jugar').textContent = 'Repetir';
  }
}

function velocidadReal() { return Math.round(Math.pow(10, 1 + el('velocidad').value / 100 * 2.6)); }
function mostrarVelocidad() { el('velocidadTexto').textContent = fmt(velocidadReal()) + ' s/s'; }

function bucle(ms) {
  if (!jugando) return;
  const dt = Math.min((ms - ultimo) / 1000, 0.1) * velocidadReal();
  ultimo = ms; paso(dt);
  if (jugando) requestAnimationFrame(bucle);
}

el('jugar').onclick = () => {
  if (!paneles.length) return;
  if (paneles.every(p => p.fin !== null)) reiniciar();
  jugando = !jugando;
  el('jugar').textContent = jugando ? 'Pausar' : 'Continuar';
  if (jugando) { ultimo = performance.now(); requestAnimationFrame(bucle); }
};
el('reiniciar').onclick = reiniciar;
el('final').onclick = () => {
  if (!paneles.length) return;
  jugando = false; el('jugar').textContent = 'Repetir';
  paneles.forEach(p => p.reiniciar()); lugarSiguiente = 1; t = 0;
  // se avanza en pasos pequeños para que los lugares de llegada respeten el orden de tiempo
  const maximo = Math.max(...paneles.map(p => p.d.eventos[p.d.eventos.length - 1][0]));
  const salto = Math.max(1, maximo / 4000);
  while (!paneles.every(p => p.fin !== null)) { t += salto; paneles.forEach(p => p.avanzar(t)); }
  paso(0);
};
el('velocidad').oninput = mostrarVelocidad;
document.addEventListener('keydown', e => { if (e.code === 'Space' && !['SELECT', 'INPUT', 'TEXTAREA', 'BUTTON'].includes(e.target.tagName)) { e.preventDefault(); el('jugar').click(); } });
window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { paneles.forEach(p => { p.sucioFondo = true; p.sucioItems = true; }); paso(0); });

el('replica').onchange = () => { replicaActual = +el('replica').value; construir(); };

function construirLeyenda() {
  const ley = el('leyenda'); ley.innerHTML = '';
  ley.insertAdjacentHTML('beforeend', '<span>El color de cada ítem depende de la política (mira la leyenda de cada panel); el número del SKU aparece en el rótulo de la tarea</span>');
  ley.insertAdjacentHTML('beforeend',
    '<span>Vista isométrica: fila 1 y columna 1 abajo a la izquierda, cada celda tiene ' + CAPAS + (CAPAS === 1 ? ' lugar' : ' lugares') + ' en profundidad</span>' +
    '<span><i class="punto" style="background:var(--acento)"></i>E/S: plataforma en el pasillo, por donde entran y salen los ítems</span>' +
    '<span>Línea discontinua: trayectoria Chebyshev (x e y a la vez, cada eje a su velocidad; el punto marca donde llega el eje más rápido)</span>' +
    '<span><i class="punto" style="background:var(--almacenar)"></i>Turquesa: hueco donde se deja un ítem, o entrada al E/S</span>' +
    '<span><i class="punto" style="background:var(--recuperar)"></i>Rosa: hueco del que se retira un ítem, o salida hacia el E/S</span>' +
    '<span><i class="punto" style="background:var(--almacenar)"></i>Tarea de almacenar</span>' +
    '<span><i class="punto" style="background:var(--recuperar)"></i>Tarea de recuperar</span>');
}

function cargarDatos(datos) {
  DATOS = datos; replicaActual = 0;
  prepararEscena();
  const sel = el('replica'); sel.innerHTML = '';
  DATOS.replicas.forEach((r, i) => { const o = document.createElement('option'); o.value = i; o.textContent = (i + 1) + ' (semilla ' + r.semilla + ')'; sel.appendChild(o); });
  construirLeyenda();
  construir();
}

function escenaVacia(texto) {
  paneles = []; DATOS = null;
  el('paneles').innerHTML = '<div class="vacio-escena">' + texto + '</div>';
  el('marcador').innerHTML = ''; el('leyenda').innerHTML = ''; el('replica').innerHTML = '';
  el('resultados').classList.remove('visible'); el('estadistica').classList.remove('visible');
}

// ================= estadística de varias réplicas =================
let ESTADISTICA = null;
const METRICAS = [
  ['tiempo_total', 'Tiempo total (s)'], ['tiempo_almacenamiento', 'Tiempo de almacenamiento (s)'], ['tiempo_recuperacion', 'Tiempo de recuperación (s)'],
  ['tiempo_reubicacion', 'Tiempo de reubicación (s)'], ['reubicaciones', 'Cantidad de reubicaciones'], ['operaciones', 'Operaciones realizadas']
];

function mostrarEstadistica(est) {
  ESTADISTICA = est;
  const sec = el('estadistica');
  if (!est || !est.replicas) { sec.classList.remove('visible'); return; }
  sec.classList.add('visible');
  const sel = el('metrica');
  if (!sel.options.length) METRICAS.forEach(([k, n]) => { const o = document.createElement('option'); o.value = k; o.textContent = n; sel.appendChild(o); });
  const m = sel.value || 'tiempo_total';
  const filas = est.politicas.slice().sort((a, b) => a[m].media - b[m].media);
  const mejor = filas[0][m].media, maxVal = Math.max(...filas.map(f => f[m].media + f[m].ic95)) || 1;
  const decimales = m === 'reubicaciones' || m === 'operaciones' ? 1 : 0;
  const nf = v => decimales ? fmt1(v) : fmt(v);
  el('tituloEstadistica').textContent = 'Estadística de ' + est.replicas + (est.replicas === 1 ? ' réplica' : ' réplicas');
  el('encEstadistica').innerHTML = '<tr><th>Política</th><th>Promedio ± IC 95 %</th><th class="num">Desv. estándar</th><th class="num">Mínimo</th><th class="num">Máximo</th><th class="num">vs. la mejor</th><th class="num">Veces mejor</th></tr>';
  el('cuerpoEstadistica').innerHTML = filas.map((f, i) => {
    const s = f[m], ancho = 100 * s.media / maxVal, inicioErr = 100 * Math.max(0, s.media - s.ic95) / maxVal, anchoErr = 100 * (Math.min(maxVal, s.media + s.ic95) - Math.max(0, s.media - s.ic95)) / maxVal;
    return '<tr class="' + (i === 0 ? 'mejor' : '') + '"><td>' + (NOMBRES[f.nombre] || f.nombre) + '</td>' +
      '<td class="celda-barra"><i class="b" style="width:' + ancho + '%"></i><i class="e" style="left:' + inicioErr + '%;width:' + anchoErr + '%"></i><span>' + nf(s.media) + ' ± ' + nf(s.ic95) + '</span></td>' +
      '<td class="num">' + nf(s.desviacion) + '</td><td class="num">' + nf(s.minimo) + '</td><td class="num">' + nf(s.maximo) + '</td>' +
      '<td class="num">' + (i === 0 || mejor === 0 ? '–' : '+' + (100 * (s.media - mejor) / mejor).toFixed(1) + ' %') + '</td>' +
      '<td class="num">' + f.victorias + ' (' + (100 * f.victorias / est.replicas).toFixed(0) + ' %)</td></tr>';
  }).join('');
  const sem = ULTIMA_CONFIG ? ULTIMA_CONFIG.escalar_semilla : null;
  el('notaEstadistica').textContent = 'Cada réplica usa una secuencia de llegadas distinta' + (sem !== null ? ' (semillas ' + sem + ' a ' + (sem + est.replicas - 1) + ')' : '') +
    '. "Veces mejor" cuenta en cuántas réplicas esa política terminó primero o empató; las barras muestran el promedio y el intervalo de confianza.';
}

el('metrica').onchange = () => mostrarEstadistica(ESTADISTICA);
el('btnCsv').onclick = () => {
  if (!ESTADISTICA) return;
  const cab = ['Politica', 'Victorias'];

// Reparto entero por mayor resto: misma regla que usa Python, para que la vista previa coincida con la simulación
function repartirEntero(total, props, minimo) {
  const n = props.length, libres = total - minimo * n, suma = props.reduce((a, b) => a + b, 0);
  if (libres < 0 || suma <= 0) return null;
  const cuotas = props.map(p => p / suma * libres), base = cuotas.map(c => Math.floor(c + 1e-9));
  let faltan = libres - base.reduce((a, b) => a + b, 0);
  cuotas.map((c, i) => [c - base[i], i]).sort((a, b) => b[0] - a[0] || a[1] - b[1]).slice(0, Math.max(0, faltan)).forEach(([, i]) => { base[i]++; });
  return base.map(b => b + minimo);
}
// Clase de cada SKU: la clase 1 agrupa a los más demandados (a igual demanda, el de menor número)
function agruparSkus(demanda, props) {
  const cant = repartirEntero(demanda.length, props, 1); if (!cant) return null;
  const orden = demanda.map((d, i) => i).sort((a, b) => demanda[b] - demanda[a] || a - b), clase = new Array(demanda.length).fill(1);
  let ini = 0; cant.forEach((c, k) => { orden.slice(ini, ini + c).forEach(i => { clase[i] = k + 1; }); ini += c; });
  return clase;
}

// Demanda de cada SKU según el formulario: lista personalizada o curva de Hausman; devuelve null si algo no es válido
function demandaDelFormulario() {
  const txt = el('demandaPersonalizada').value.trim();
  if (txt) {
    const v = txt.split(/[\s,;]+/).filter(x => x !== '').map(Number);
    if (!v.length || v.some(x => !isFinite(x) || x < 0) || v.reduce((a, b) => a + b, 0) <= 0) return null;
    const s = v.reduce((a, b) => a + b, 0); return v.map(x => x / s);
  }
  const n = Math.round(Number(el('nSkus').value)), sigma = Number(el('sigma').value);
  if (!(n >= 1 && n <= 200) || !(sigma > 0 && sigma <= 1)) return null;
  return Array.from({ length: n }, (_, i) => Math.pow((i + 1) / n, sigma) - Math.pow(i / n, sigma));
}

// Resumen siempre visible: lo esencial de la configuración y los avisos más comunes
function actualizarResumen() {
  const v = (clave, i) => { const x = entradas.find(e => e.c.clave === clave && e.c.indice === i); return x ? Number(x.inp.value) : NaN; };

  ];

}

    const txt = inp.value.trim(), v = txt === '' ? NaN : Number(txt) / (c.factor || 1);
    if (!isFinite(v)) { inp.classList.add('invalido'); primerError = primerError || ((c.nombreError || c.etiqueta) + ': falta el valor.'); return; }
    if (c.indice === null) cfg[c.clave] = v; else cfg[c.clave][c.indice] = v;
  });
  // demanda: lista personalizada o curva de Hausman
  const txtDemanda = el('demandaPersonalizada').value.trim();
  if (txtDemanda) {
    const v = txtDemanda.split(/[\s,;]+/).filter(x => x !== '').map(Number);
    if (!v.length || v.some(x => !isFinite(x) || x < 0) || v.reduce((a, b) => a + b, 0) <= 0) { el('demandaPersonalizada').classList.add('invalido'); primerError = primerError || 'Demanda personalizada: usa números positivos separados por comas.'; }
    cfg.vector_demanda_sku_personalizada = v;
  } else { cfg.vector_demanda_sku_personalizada = null; }
  cfg.escalar_numero_skus = Number(el('nSkus').value); cfg.escalar_sigma_hausman = Number(el('sigma').value);
  if (!txtDemanda && !(cfg.escalar_numero_skus >= 1)) { el('nSkus').classList.add('invalido'); primerError = primerError || 'Cantidad de SKUs: falta el valor.'; }
  if (!txtDemanda && !(cfg.escalar_sigma_hausman > 0)) { el('sigma').classList.add('invalido'); primerError = primerError || 'Sesgo de la demanda: debe estar entre 0 y 1.'; }
  cfg.vector_proporcion_skus_por_clase = clasesUI.slice();
  const pct = Number(el('pctAlmacenar').value);
  if (el('pctAlmacenar').value === '' || !isFinite(pct) || pct < 0 || pct > 100) { el('pctAlmacenar').classList.add('invalido'); primerError = primerError || '% almacenar: debe estar entre 0 y 100.'; }
  cfg.vector_prob_acum_AR = [pct / 100, 1];
  if (el('tareasAuto').checked) delete cfg.escalar_largo_secuencia; else cfg.escalar_largo_secuencia = Number(el('tareasN').value);
  cfg.vector_politicas_asignacion = Array.from(document.querySelectorAll('[data-politica]:checked')).map(c => c.dataset.politica);
  if (primerError) { mostrarPrimerError(); throw new Error(primerError); }
  return cfg;
}

// ================= aviso, ejecución y progreso =================
let trabajoActual = null, temporizador = null;
function aviso(tipo, html) {
  const a = el('aviso'); a.className = 'aviso visible ' + (tipo || ''); a.innerHTML = html;
}
function ocultarAviso() { el('aviso').className = 'aviso'; }

async function simular() {
  let cfg;
  try { cfg = leerFormulario(); } catch (e) { aviso('error', e.message); return; }
  el('btnSimular').disabled = true;
  aviso('', '<div class="progreso"><span>Enviando…</span></div>');
  try {
    const r = await fetch('/api/simular', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ config: cfg }) });
    const j = await r.json();
    if (!r.ok) throw new Error(j.error || 'No se pudo iniciar la simulación.');
    trabajoActual = j.id; ULTIMA_CONFIG = cfg;
    try { localStorage.setItem('asrs_config', JSON.stringify(cfg)); } catch (e) {}
    consultar();
  } catch (e) {
    aviso('error', e.message); el('btnSimular').disabled = false;
  }
}

async function consultar() {
  try {
    const r = await fetch('/api/trabajo/' + trabajoActual); const j = await r.json();
    if (!r.ok) throw new Error(j.error || 'Se perdió la simulación.');
    if (j.estado === 'listo') {
      const rr = await fetch('/api/trabajo/' + trabajoActual + '?resultado=1'); const jj = await rr.json();
      terminar(jj.resultado, j.segundos); return;
    }
    if (j.estado === 'error') throw new Error(j.error || 'La simulación falló.');
    if (j.estado === 'cancelado') { aviso('', 'Simulación cancelada.'); el('btnSimular').disabled = false; return; }
    const pct = Math.round(100 * j.progreso / Math.max(1, j.total));
    aviso('', '<div class="progreso"><span>' + (j.mensaje || 'Simulando') + '… ' + j.progreso + '/' + j.total + '</span><div class="barra"><i style="width:' + pct + '%"></i></div><button id="btnCancelar">Cancelar</button></div>');
    el('btnCancelar').onclick = () => fetch('/api/cancelar/' + trabajoActual, { method: 'POST' });
    temporizador = setTimeout(consultar, 400);
  } catch (e) {
    aviso('error', e.message); el('btnSimular').disabled = false;
  }
}

function terminar(resultado, segundos) {
  el('btnSimular').disabled = false;
  aviso('exito', 'Simulación lista en ' + fmt1(segundos) + ' s. Pulsa Iniciar para ver la carrera.');
  cargarDatos(resultado.datos);
  mostrarEstadistica(resultado.estadistica);
}

// ================= arranque =================
async function iniciar() {
  mostrarVelocidad();
  const hayServidor = location.protocol.startsWith('http');
  if (hayServidor) {
    try {
      const r = await fetch('/api/config'); CONFIG_DEFECTO = await r.json();
    } catch (e) { CONFIG_DEFECTO = null; }
    if (CONFIG_DEFECTO && (CONFIG_DEFECTO.escalar_numero_skus === undefined || CONFIG_DEFECTO.vector_proporcion_skus_por_clase === undefined)) {
      // el servidor corre una versión anterior del programa y no entiende los parámetros actuales
      CONFIG_DEFECTO = null;
      escenaVacia('El servidor que responde en esta dirección es de una versión anterior. Ciérralo con Ctrl+C en su terminal y vuelve a ejecutar <code>python visualizar.py --servir</code>.');
      return;
    }
  }
  if (CONFIG_DEFECTO) {
    // modo interactivo: formulario y simulación en el servidor local
    el('app').classList.remove('sin-parametros'); el('btnParametros').style.display = '';
    construirFormulario();
    let inicial = CONFIG_DEFECTO;
    try { const g = localStorage.getItem('asrs_config'); if (g) inicial = { ...CONFIG_DEFECTO, ...JSON.parse(g) }; } catch (e) {}
    ponerFormulario(inicial);
    el('btnSimular').onclick = simular;
    el('btnRestablecer').onclick = () => { ponerFormulario(CONFIG_DEFECTO); ocultarAviso(); };
    el('btnGuardar').onclick = () => { try { descargar('configuracion_asrs.json', JSON.stringify(leerFormulario(), null, 2), 'application/json'); } catch (e) { aviso('error', e.message); } };
    el('btnCargar').onclick = () => el('archivoConfig').click();
    el('archivoConfig').onchange = async ev => {
      const archivo = ev.target.files[0]; if (!archivo) return;
      try { ponerFormulario({ ...CONFIG_DEFECTO, ...JSON.parse(await archivo.text()) }); aviso('exito', 'Parámetros cargados desde ' + archivo.name + '.'); }
      catch (e) { aviso('error', 'El archivo no es una configuración válida.'); }
      ev.target.value = '';
    };
    el('btnParametros').onclick = () => { const cerrado = el('app').classList.toggle('cerrado'); el('btnParametros').textContent = cerrado ? 'Mostrar parámetros' : 'Ocultar parámetros'; };
    escenaVacia('Ajusta los parámetros y pulsa <b>Simular</b>.');
    // Si ya hay una simulación corriendo (por ejemplo, se recargó la página) se reconecta a ella; si no, la primera usa los valores iniciales
    let activo = null;
    try { activo = (await (await fetch('/api/activo')).json()).id; } catch (e) {}
    if (activo) { trabajoActual = activo; ULTIMA_CONFIG = CONFIG_DEFECTO; el('btnSimular').disabled = true; consultar(); } else { simular(); }
  } else if (DATOS_INICIALES) {
    // archivo autónomo: solo reproduce los datos incrustados
    cargarDatos(DATOS_INICIALES);
  } else {
    escenaVacia('Esta página necesita el servidor local. Ejecuta <code>python visualizar.py --servir</code>.');
  }
}
iniciar();
</script>
