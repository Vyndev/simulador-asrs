[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "simulador-asrs"
version = "0.1.0"
description = "Simulador de un ASRS de grúa para comparar políticas de asignación y recuperación (tesis)"
requires-python = ">=3.10"
dependencies = ["numpy", "pandas"]

[project.optional-dependencies]
# Aprendizaje por refuerzo (scripts/entrenar_rl.py). torch en versión CPU:
#   pip install torch --index-url https://download.pytorch.org/whl/cpu
rl = ["torch", "gymnasium", "stable-baselines3", "sb3-contrib"]

[tool.setuptools.packages.find]
include = ["asrs*"]

[tool.setuptools.package-data]
"asrs.visualizacion" = ["plantilla.html", "vendor/*"]
